services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BETTER_AUTH_URL: https://${ASBIR_DOMAIN:?Set ASBIR_DOMAIN in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      ASBIR_DATA_DIR: /var/lib/asbir-handoff
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      ASBIR_MCP_ALLOWED_ORIGINS: ${ASBIR_MCP_ALLOWED_ORIGINS:-}
    volumes:
      - asbir_data:/var/lib/asbir-handoff
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/sign-in').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ASBIR_DOMAIN: ${ASBIR_DOMAIN:?Set ASBIR_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  asbir_data:
  caddy_data:
  caddy_config:
